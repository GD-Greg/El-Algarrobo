<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos | El Algarrobo</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="js/navegacion.js" defer></script>
    <script src="js/pedidos.js" defer></script>
</head>

<body class="dashboard-body">
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>El Algarrobo</h1>
                <p>Panel de gestión</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    Inicio
                </a>

                <a href="productos.html" class="nav-link">
                    Muebles
                </a>

                <a
                    href="clientes.html"
                    class="nav-link"
                    id="enlace-clientes"
                    hidden
                >
                    Clientes
                </a>

                <a href="pedidos.html" class="nav-link active">
                    Pedidos
                </a>

                <a
                    href="empleados.html"
                    class="nav-link"
                    id="enlace-empleados"
                    hidden
                >
                    Empleados
                </a>

                <a
                href="asignaciones.html"
                class="nav-link"
                id="enlace-asignaciones"
                hidden
                >
                    Asignaciones
                </a>

                <a
                    href="notas-produccion.html"
                    class="nav-link"
                    id="enlace-produccion"
                    hidden
                >
                    Producción
                </a>
            </nav>

            <button type="button" id="logout-button">
                Cerrar sesión
            </button>
        </aside>

        <main class="dashboard-main">
            <header class="page-header">
                <div>
                    <h2>Pedidos</h2>
                    <p>Administración de pedidos de El Algarrobo</p>
                </div>

                <button
                    type="button"
                    id="nuevo-pedido-button"
                    class="primary-button"
                    hidden
                >
                    Nuevo pedido
                </button>
            </header>

            <section class="content-card">
                <form id="busqueda-pedidos-form" class="search-form">
                    <div class="form-group">
                        <label for="buscar-numero-pedido">
                            Número de pedido
                        </label>

                        <input
                            type="number"
                            id="buscar-numero-pedido"
                            min="1"
                            step="1"
                        >
                    </div>

                    <div class="form-group">
                        <label for="buscar-cliente-id">
                            Número de cliente
                        </label>

                        <input
                            type="number"
                            id="buscar-cliente-id"
                            min="1"
                            step="1"
                        >
                    </div>

                    <div class="form-group">
                        <label for="buscar-estado">Estado</label>

                        <select id="buscar-estado">
                            <option value="">Todos los estados</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="asignado">Asignado</option>
                            <option value="en_produccion">En producción</option>
                            <option value="terminado">Terminado</option>
                            <option value="cliente_avisado">Cliente avisado</option>
                            <option value="retirado_por_cliente">
                                Retirado por el cliente
                            </option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="buscar-orden">Orden por fecha</label>

                        <select id="buscar-orden">
                            <option value="desc">Más recientes</option>
                            <option value="asc">Más antiguos</option>
                        </select>
                    </div>

                    <div class="search-actions">
                        <button type="submit" class="primary-button">
                            Buscar
                        </button>

                        <button
                            type="button"
                            id="limpiar-busqueda-button"
                            class="secondary-button"
                        >
                            Mostrar todos
                        </button>
                    </div>
                </form>
            </section>

            <p id="pedidos-mensaje" class="page-message"></p>

            <section class="content-card table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>N.º</th>
                            <th>Cliente</th>
                            <th>Fecha del pedido</th>
                            <th>Entrega estimada</th>
                            <th>Seña</th>
                            <th>Estado</th>
                            <th>Muebles</th>

                            <th id="acciones-header" hidden>
                                Acciones
                            </th>
                        </tr>
                    </thead>

                    <tbody id="pedidos-table-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <section id="pedido-modal" class="modal" hidden>
        <div class="modal-content pedido-modal-content">
            <header class="modal-header">
                <h2>Nuevo pedido</h2>

                <button
                    type="button"
                    id="cerrar-modal-button"
                    class="close-button"
                    aria-label="Cerrar"
                >
                    ×
                </button>
            </header>

            <form id="pedido-form">
                <div class="form-group">
                    <label for="pedido-cliente">Cliente</label>

                    <select id="pedido-cliente" required>
                        <option value="">
                            Seleccionar cliente
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pedido-fecha-estimada">
                        Fecha estimada de entrega
                    </label>

                    <input
                        type="date"
                        id="pedido-fecha-estimada"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="pedido-senia">Seña</label>

                    <input
                        type="number"
                        id="pedido-senia"
                        min="0"
                        step="0.01"
                        value="0"
                        required
                    >
                </div>

                <div class="pedido-productos-header">
                    <h3>Muebles del pedido</h3>

                    <button
                        type="button"
                        id="agregar-producto-button"
                        class="secondary-button"
                    >
                        Agregar mueble
                    </button>
                </div>

                <div id="pedido-productos-container">
                </div>

                <p id="pedido-form-error" class="mensaje-error"></p>

                <div class="modal-actions">
                    <button
                        type="button"
                        id="cancelar-pedido-button"
                        class="secondary-button"
                    >
                        Cancelar
                    </button>

                    <button type="submit" class="primary-button">
                        Crear pedido
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
