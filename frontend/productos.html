<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muebles | El Algarrobo</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="js/navegacion.js" defer></script>
    <script src="js/productos.js" defer></script>
</head>

<body class="dashboard-body">
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>El Algarrobo</h1>
                <p>Panel de gestión</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    Inicio
                </a>

                <a href="productos.html" class="nav-link active">
                    Muebles
                </a>

                <a
                    href="clientes.html"
                    class="nav-link"
                    id="enlace-clientes"
                    hidden
                >
                    Clientes
                </a>

                <a href="pedidos.html" class="nav-link">
                    Pedidos
                </a>

                <a
                    href="empleados.html"
                    class="nav-link"
                    id="enlace-empleados"
                    hidden
                >
                    Empleados
                </a>

                <a
                    href="asignaciones.html"
                    class="nav-link"
                    id="enlace-asignaciones"
                    hidden
                >
                    Asignaciones
                </a>

                <a
                    href="notas-produccion.html"
                    class="nav-link"
                    id="enlace-produccion"
                    hidden
                >
                    Producción
                </a>
            </nav>

            <button type="button" id="logout-button">
                Cerrar sesión
            </button>
        </aside>

        <main class="dashboard-main">
            <header class="page-header">
                <div>
                    <h2>Muebles</h2>
                    <p>Administración del catálogo de El Algarrobo</p>
                </div>

                <button
                    type="button"
                    id="nuevo-producto-button"
                    class="primary-button"
                    hidden
                >
                    Nuevo mueble
                </button>
            </header>

            <section class="content-card">
                <form id="busqueda-productos-form" class="search-form">
                    <div class="form-group">
                        <label for="buscar-codigo">Código del mueble</label>

                        <input
                            type="text"
                            id="buscar-codigo"
                            placeholder="Ejemplo: MES-001"
                        >
                    </div>

                    <div class="form-group">
                        <label for="buscar-numero-pedido">
                            Número de pedido
                        </label>

                        <input
                            type="number"
                            id="buscar-numero-pedido"
                            min="1"
                            step="1"
                        >
                    </div>

                    <div class="form-group">
                        <label for="buscar-orden">Orden por código</label>

                        <select id="buscar-orden">
                            <option value="asc">A–Z</option>
                            <option value="desc">Z–A</option>
                        </select>
                    </div>

                    <div class="search-actions">
                        <button type="submit" class="primary-button">
                            Buscar
                        </button>

                        <button
                            type="button"
                            id="limpiar-busqueda-button"
                            class="secondary-button"
                        >
                            Mostrar todos
                        </button>
                    </div>
                </form>
            </section>

            <p id="productos-mensaje" class="page-message"></p>

            <section class="content-card table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>Tamaños sugeridos</th>
                            <th>Labrado</th>
                            <th>Precio</th>

                            <th id="acciones-header" hidden>
                                Acciones
                            </th>
                        </tr>
                    </thead>

                    <tbody id="productos-table-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <section id="producto-modal" class="modal" hidden>
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="producto-modal-title">Nuevo mueble</h2>

                <button
                    type="button"
                    id="cerrar-modal-button"
                    class="close-button"
                    aria-label="Cerrar"
                >
                    ×
                </button>
            </header>

            <form id="producto-form">
                <input type="hidden" id="producto-id">

                <div class="form-group">
                    <label for="producto-codigo">Código</label>

                    <input
                        type="text"
                        id="producto-codigo"
                        minlength="1"
                        maxlength="30"
                        placeholder="Ejemplo: MES-001"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="producto-descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="producto-descripcion"
                        minlength="5"
                        maxlength="500"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="producto-tamanos">
                        Tamaños sugeridos
                    </label>

                    <input
                        type="text"
                        id="producto-tamanos"
                        minlength="2"
                        maxlength="200"
                        placeholder="Ejemplo: 120 × 80 × 75 cm"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="producto-labrado">Labrado</label>

                    <select id="producto-labrado">
                        <option value="false">No requiere</option>
                        <option value="true">Requiere labrado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="producto-precio">Precio</label>

                    <input
                        type="number"
                        id="producto-precio"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <p id="producto-form-error" class="mensaje-error"></p>

                <div class="modal-actions">
                    <button
                        type="button"
                        id="cancelar-producto-button"
                        class="secondary-button"
                    >
                        Cancelar
                    </button>

                    <button type="submit" class="primary-button">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
