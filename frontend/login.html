<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | El Algarrobo</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/login.js" defer></script>
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <header class="login-header">
                <h1>El Algarrobo</h1>
                <p>Ingresá tus datos para acceder al sistema</p>
            </header>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-group">
                    <label for="captcha">Código CAPTCHA</label>

                    <div class="captcha-container">
                        <span id="captcha-code">Cargando...</span>

                        <button
                            type="button"
                            id="refresh-captcha"
                            aria-label="Generar un nuevo CAPTCHA"
                        >
                            Actualizar
                        </button>
                    </div>

                    <input
                        type="text"
                        id="captcha"
                        name="captcha"
                        required
                        maxlength="5"
                        autocomplete="off"
                    >
                </div>

                <p id="mensaje-error" class="mensaje-error"></p>

                <button type="submit" class="login-button">
                    Iniciar sesión
                </button>
            </form>
        </section>
    </main>
</body>
</html>
