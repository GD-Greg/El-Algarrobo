<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Notas de producción | El Algarrobo
    </title>

    <link rel="stylesheet" href="css/styles.css">

    <script
        src="js/notas-produccion.js"
        defer
    ></script>
</head>

<body class="dashboard-body">
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>El Algarrobo</h1>
                <p>Panel de gestión</p>
            </div>

            <nav class="sidebar-nav">
                <a
                    href="dashboard.html"
                    class="nav-link"
                >
                    Inicio
                </a>

                <a
                    href="productos.html"
                    class="nav-link"
                >
                    Muebles
                </a>

                <a
                    href="clientes.html"
                    class="nav-link"
                    id="enlace-clientes"
                    hidden
                >
                    Clientes
                </a>

                <a
                    href="pedidos.html"
                    class="nav-link"
                >
                    Pedidos
                </a>

                <a
                    href="empleados.html"
                    class="nav-link"
                    id="enlace-empleados"
                    hidden
                >
                    Empleados
                </a>

                <a
                    href="asignaciones.html"
                    class="nav-link"
                >
                    Asignaciones
                </a>

                <a
                    href="notas-produccion.html"
                    class="nav-link active"
                >
                    Producción
                </a>
            </nav>

            <button
                type="button"
                id="logout-button"
            >
                Cerrar sesión
            </button>
        </aside>

        <main class="dashboard-main">
            <header class="page-header">
                <div>
                    <h2>Notas de producción</h2>

                    <p>
                        Registro de unidades terminadas
                    </p>
                </div>

                <button
                    type="button"
                    id="nueva-nota-button"
                    class="primary-button"
                    hidden
                >
                    Registrar unidad terminada
                </button>
            </header>

            <section class="content-card">
                <form
                    id="busqueda-notas-form"
                    class="search-form"
                >
                    <div class="form-group">
                        <label for="buscar-numero-nota">
                            Número de nota
                        </label>

                        <input
                            type="number"
                            id="buscar-numero-nota"
                            min="1"
                            step="1"
                            placeholder="Ejemplo: 1"
                        >
                    </div>

                    <div class="form-group">
                        <label for="buscar-numero-pedido">
                            Número de pedido
                        </label>

                        <input
                            type="number"
                            id="buscar-numero-pedido"
                            min="1"
                            step="1"
                            placeholder="Ejemplo: 1"
                        >
                    </div>

                    <div class="form-group">
                        <label for="buscar-codigo-mueble">
                            Código del mueble
                        </label>

                        <input
                            type="text"
                            id="buscar-codigo-mueble"
                            placeholder="Ejemplo: MES-001"
                        >
                    </div>

                    <div class="form-group">
                        <label for="buscar-codigo-carpintero">
                            Código del carpintero
                        </label>

                        <input
                            type="text"
                            id="buscar-codigo-carpintero"
                            placeholder="Ejemplo: CAR-A01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="buscar-orden">
                            Orden por fecha
                        </label>

                        <select id="buscar-orden">
                            <option value="desc">
                                Más recientes
                            </option>

                            <option value="asc">
                                Más antiguas
                            </option>
                        </select>
                    </div>

                    <div class="search-actions">
                        <button
                            type="submit"
                            class="primary-button"
                        >
                            Buscar
                        </button>

                        <button
                            type="button"
                            id="limpiar-busqueda-button"
                            class="secondary-button"
                        >
                            Mostrar todas
                        </button>
                    </div>
                </form>
            </section>

            <p
                id="notas-mensaje"
                class="page-message"
            ></p>

            <section
                class="content-card table-container"
            >
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>N.º de nota</th>
                            <th>Pedido</th>
                            <th>Mueble</th>
                            <th>Unidad terminada</th>
                            <th>Carpintero</th>
                            <th>Fecha de entrega</th>
                        </tr>
                    </thead>

                    <tbody id="notas-table-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <section
        id="nota-modal"
        class="modal"
        hidden
    >
        <div class="modal-content">
            <header class="modal-header">
                <h2>Registrar unidad terminada</h2>

                <button
                    type="button"
                    id="cerrar-modal-button"
                    class="close-button"
                    aria-label="Cerrar"
                >
                    ×
                </button>
            </header>

            <form id="nota-form">
                <div class="form-group">
                    <label for="nota-asignacion">
                        Asignación en producción
                    </label>

                    <select
                        id="nota-asignacion"
                        required
                    >
                        <option value="">
                            Seleccionar asignación
                        </option>
                    </select>
                </div>

                <div
                    id="nota-asignacion-info"
                    class="welcome-card"
                    hidden
                >
                    <p id="nota-pedido-info"></p>
                    <p id="nota-mueble-info"></p>
                    <p id="nota-progreso-info"></p>
                </div>

                <p
                    id="nota-form-error"
                    class="mensaje-error"
                ></p>

                <div class="modal-actions">
                    <button
                        type="button"
                        id="cancelar-nota-button"
                        class="secondary-button"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Registrar unidad
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
